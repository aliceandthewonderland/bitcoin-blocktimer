<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bitcoin Block Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar">
    <div class="title">Bitcoin Block Timer</div>
    <div class="window-controls">
      <div class="minimize-button" id="minimize-button">_</div>
      <div class="close-button" id="close-button">✕</div>
    </div>
  </div>
  
  <div class="container">
    <div class="task-input">
      <input type="text" id="task-input" placeholder="What task are you focusing on?">
    </div>
    
    <div class="block-status">
      <div class="large-block-info">
        <h1>Current Block: <span id="current-block">Loading...</span></h1>
        <h2>Connection Status: <span id="connection-status">Connecting...</span></h2>
      </div>
    </div>
    
    <!-- Block animation container -->
    <div class="block-animation-container" id="block-animation-container">
      <div class="blockchain-path"></div>
      <div class="animated-blocks" id="animated-blocks"></div>
    </div>
    
    <div class="block-selector">
      <h3>Select Target Block Count:</h3>
      <div class="blocks-visualization">
        <div class="blocks-row" id="blocks-row">
          <!-- Blocks will be generated here by JavaScript -->
        </div>
        <div class="slider-container">
          <input type="range" min="1" max="10" value="1" class="slider" id="block-slider">
          <div class="block-count" id="block-count">1 Block</div>
        </div>
      </div>
      <p class="info-text">Approximately 10 minutes per block on average</p>
    </div>
    
    <div class="controls">
      <button id="start-button" class="control-button">Start Timer</button>
      <button id="reset-button" class="control-button" disabled>Reset</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
